# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scarica gli articoli dal repo delle news nella cartella news/
      - uses: actions/checkout@v4
        with:
          repository: riasissu/riasissu-news
          path: news

      # Solo se oggi le immagini degli articoli stanno in public/ con percorsi assoluti:
      - run: mkdir -p public/news && mv -r news/uploads/. public/news

      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIASISSU_7C453 }}
          channelId: live
          projectId: riasissu-7c453